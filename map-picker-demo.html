<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500米范围选点测试</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Microsoft YaHei", sans-serif; }
    #map { height: 100%; width: 100%; }

    #panel {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      padding: 14px 16px;
      width: 300px;
      font-size: 13px;
      line-height: 1.9;
    }
    #panel h3 {
      font-size: 15px;
      margin-bottom: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    #panel .label { color: #888; }
    #panel .value { font-family: Consolas, monospace; }
    #distance { font-weight: bold; }
    #distance.in-range { color: #1a9c4b; }
    #distance.out-range { color: #d4380d; }
    #status { margin-top: 6px; font-weight: bold; }
    #status.in-range { color: #1a9c4b; }
    #status.out-range { color: #d4380d; }
    #clearBtn {
      margin-top: 10px;
      width: 100%;
      padding: 6px 0;
      border: none;
      border-radius: 4px;
      background: #1677ff;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }
    #clearBtn:hover { background: #4096ff; }
    .tip { color: #aaa; font-size: 12px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h3>选点信息（半径 500 米）</h3>
    <div><span class="label">圆心坐标：</span><br><span class="value">30.494585, 114.381391</span></div>
    <div style="margin-top:6px"><span class="label">选中坐标：</span><br><span class="value" id="coord">点击地图选点</span></div>
    <div style="margin-top:6px"><span class="label">距圆心距离：</span><span class="value" id="distance">--</span></div>
    <div id="status"></div>
    <button id="clearBtn">清除选点</button>
    <div class="tip">提示：点击地图任意位置进行选点测试</div>
  </div>

  <script>
    // ============ 配置 ============
    var CENTER = [30.494585, 114.381391]; // 圆心 [纬度, 经度]
    var RADIUS = 500;                     // 半径（米）

    // ============ 地图初始化（高德瓦片，GCJ-02 坐标系）============
    var map = L.map('map', {
      center: CENTER,
      zoom: 16,
      minZoom: 5,
      maxZoom: 18
    });

    L.tileLayer(
      'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
      { subdomains: ['1', '2', '3', '4'], attribution: '© 高德地图' }
    ).addTo(map);

    // ============ 圆心标记 + 500米范围圆 ============
    L.marker(CENTER, {
      title: '圆心'
    }).addTo(map).bindPopup('圆心<br>30.494585, 114.381391');

    L.circle(CENTER, {
      radius: RADIUS,
      color: '#1677ff',
      weight: 2,
      fillColor: '#1677ff',
      fillOpacity: 0.08
    }).addTo(map);

    // ============ 距离计算（Haversine 公式，返回米）============
    function distanceMeters(lat1, lng1, lat2, lng2) {
      var R = 6371000; // 地球半径（米）
      var rad = Math.PI / 180;
      var dLat = (lat2 - lat1) * rad;
      var dLng = (lng2 - lng1) * rad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // ============ 点击选点 ============
    var pickMarker = null;
    var rangeLine = null;

    var coordEl = document.getElementById('coord');
    var distanceEl = document.getElementById('distance');
    var statusEl = document.getElementById('status');

    map.on('click', function (e) {
      var lat = e.latlng.lat;
      var lng = e.latlng.lng;
      var dist = distanceMeters(CENTER[0], CENTER[1], lat, lng);
      var inRange = dist <= RADIUS;

      // 移除旧标记
      if (pickMarker) map.removeLayer(pickMarker);
      if (rangeLine) map.removeLayer(rangeLine);

      // 新选点标记（范围内绿色，范围外红色）
      pickMarker = L.circleMarker([lat, lng], {
        radius: 8,
        color: inRange ? '#1a9c4b' : '#d4380d',
        weight: 2,
        fillColor: inRange ? '#1a9c4b' : '#d4380d',
        fillOpacity: 0.7
      }).addTo(map);

      // 选点与圆心连线
      rangeLine = L.polyline([CENTER, [lat, lng]], {
        color: inRange ? '#1a9c4b' : '#d4380d',
        weight: 2,
        dashArray: '6,6'
      }).addTo(map);

      // 面板信息
      coordEl.textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
      distanceEl.textContent = dist.toFixed(2) + ' 米';
      distanceEl.className = 'value ' + (inRange ? 'in-range' : 'out-range');
      statusEl.textContent = inRange ? '✔ 在 500 米范围内' : '✘ 超出 500 米范围（超出 ' + (dist - RADIUS).toFixed(2) + ' 米）';
      statusEl.className = inRange ? 'in-range' : 'out-range';
    });

    // ============ 清除选点 ============
    document.getElementById('clearBtn').onclick = function () {
      if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
      if (rangeLine) { map.removeLayer(rangeLine); rangeLine = null; }
      coordEl.textContent = '点击地图选点';
      distanceEl.textContent = '--';
      distanceEl.className = 'value';
      statusEl.textContent = '';
    };
  </script>
</body>
</html>
