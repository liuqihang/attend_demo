<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 打卡服务</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap-narrow">

  <div class="hero">
    <h1>登录</h1>
    <p>手机验证码登录 · 登录成功后才能进入打卡页面</p>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="badge">1</div>
      <h2>手机验证码登录<span class="sub">仅支持指定手机号</span></h2>
      <div class="head-right"><span class="pill" id="loginStatus">未登录</span></div>
    </div>

    <label>手机号</label>
    <div class="row">
      <input type="text" id="phone" class="grow-2" value="18900126960" placeholder="如 18900126960">
      <button class="ghost" id="smsBtn">获取验证码</button>
    </div>

    <label>手机验证码</label>
    <div class="row">
      <input type="text" id="phoneCode" class="grow-2" placeholder="收到的 6 位验证码">
      <button id="loginBtn">登 录</button>
    </div>

    <div id="msg" class="msg hidden"></div>

    <div class="actions">
      <button class="ghost small" id="toggleResp">显示接口返回</button>
    </div>
    <pre id="resp" class="hidden">（暂无数据）</pre>
  </div>

</div>

<script>
  const $ = (id) => document.getElementById(id);

  // 登录信息在 sessionStorage 中的键名，app2.html 会读取它
  const STORAGE_KEY = 'lxqy_login';

  // 服务端 403 时返回的提示（含当前支持的白名单手机号，来自 phone-whitelist.conf）
  function phoneBlockedMsg(json, phone) {
    return (json && json.tip)
      ? `${json.tip}（本次尝试已记录到服务端日志）`
      : `不支持该手机号 ${phone}（本次尝试已记录到服务端日志）`;
  }

  function showMsg(type, text) {
    const el = $('msg');
    el.className = 'msg ' + type;
    el.textContent = text;
    el.classList.remove('hidden');
  }

  function setStatus(type, text) {
    $('loginStatus').className = 'pill ' + (type || '');
    $('loginStatus').textContent = text;
  }

  $('toggleResp').onclick = () => {
    const pre = $('resp');
    pre.classList.toggle('hidden');
    $('toggleResp').textContent = pre.classList.contains('hidden') ? '显示接口返回' : '隐藏接口返回';
  };

  // ---- 获取验证码 ----
  $('smsBtn').onclick = async () => {
    const phone = $('phone').value.trim();
    if (!phone) return showMsg('err', '请输入手机号');

    setStatus('busy', '请求中…');
    showMsg('busy', '正在获取验证码…');
    try {
      const r = await fetch('api/getSmsCode?username=' + encodeURIComponent(phone));
      const json = await r.json();
      $('resp').textContent = '【getSmsCode】HTTP ' + r.status + '\n' + JSON.stringify(json, null, 2);

      if (r.status === 403) {
        console.warn('[不支持手机号] 已由服务端拦截并记录:', phone, json);
        setStatus('err', '手机号不支持');
        return showMsg('err', phoneBlockedMsg(json, phone));
      }
      if (json.body && json.body.success) {
        setStatus('ok', '验证码已发送');
        return showMsg('ok', '验证码已发送，请查看手机短信');
      }
      setStatus('err', '获取失败');
      showMsg('err', '获取验证码失败：' + ((json.body && json.body.tip) || '请稍后重试'));
    } catch (e) {
      setStatus('err', '请求异常');
      showMsg('err', '请求异常：' + e.message);
    }
  };

  // ---- 登录 ----
  $('loginBtn').onclick = async () => {
    const phone = $('phone').value.trim();
    const phoneCode = $('phoneCode').value.trim();
    if (!phone) return showMsg('err', '请输入手机号');
    if (!phoneCode) return showMsg('err', '请输入验证码');

    setStatus('busy', '登录中…');
    showMsg('busy', '正在登录…');
    try {
      const r = await fetch('api/loginBySmsCode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, phoneCode, username: phone }),
      });
      const json = await r.json();
      $('resp').textContent = '【loginBySmsCode】HTTP ' + r.status + '\n' + JSON.stringify(json, null, 2);

      if (r.status === 403) {
        console.warn('[不支持手机号] 已由服务端拦截并记录:', phone, json);
        setStatus('err', '手机号不支持');
        return showMsg('err', phoneBlockedMsg(json, phone));
      }
      if (json.body && json.body.success) {
        // 登录成功：把登录信息写入 sessionStorage，再跳转打卡页
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ phone, data: json.body.data }));
        setStatus('ok', '登录成功');
        showMsg('ok', '登录成功，正在进入打卡页面…');
        setTimeout(() => location.replace('app2.html'), 400);
        return;
      }
      setStatus('err', '登录失败');
      showMsg('err', '登录失败：' + ((json.body && json.body.tip) || '请检查手机号与验证码'));
    } catch (e) {
      setStatus('err', '登录异常');
      showMsg('err', '登录异常：' + e.message);
    }
  };
</script>
</body>
</html>
